[package]
name = "gi_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Global Illumination (`pulsar.gi`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# Nothing: GI registers no editor UI (the project settings window edits its
# settings group). Hosts turn it on with the rest of the installed set's
# editor registrations.
editor = []

[dependencies]
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
# The plugin's feature crate.
helio-pass-gi = { workspace = true }
helio = { workspace = true }
helio-feature-api = { workspace = true }
# The engine seams the plugin registers into: the game's slim feature set
# (as pulsar_game), so linking the plugin pulls no editor features into a
# game build.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
pulsar_settings = { workspace = true }

[dev-dependencies]
wgpu = { workspace = true }

[lints]
workspace = true
