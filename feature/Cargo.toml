[package]
name = "helio-pass-gi"
version = "0.1.0"
edition = "2021"
description = "Helio world-space diffuse global illumination: a probe clipmap traced through the frame's ray streams"
license = "MIT OR Apache-2.0"

[dependencies]
helio-frame-api = { workspace = true }
helio-core = { workspace = true }
helio-feature-api = { workspace = true }
helio-gi-api = { workspace = true }
helio-settings = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
log = { workspace = true }

[dev-dependencies]
pollster = "=0.4.0"
# The tests light GI's hits through the lights' sampler (a kind's sampler
# offered through the frame's light samples), from light rows.
helio-light-api = { workspace = true }
helio-pass-light-sampler = { workspace = true }
# The probe tests trace GI's streams with an analytic tracer of their own
# (no kind). The graph tests: mesh and virtual-geometry scenes over Helio's
# presets plus this feature, traced by the meshes' tracer
# (`helio-pass-mesh-rays`, in the meshes' features), their rows as the
# plugins' host components.
helio = { workspace = true }
helio-presets = { workspace = true }
helio-mats = { workspace = true, features = ["host-rows"] }
helio-light-host = { workspace = true }
helio-mesh-api = { workspace = true }
helio-mesh-host = { workspace = true }
helio-pass-mesh-rays = { workspace = true }
helio-vg-build = { workspace = true }
helio-vg-format = { workspace = true }
helio-vg-stream = { workspace = true }
pulsar_scenedb = { workspace = true }
